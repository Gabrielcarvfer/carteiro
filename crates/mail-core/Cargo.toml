[package]
name = "mail-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Protocol, storage, threading and rules engine for Carteiro"

[dependencies]
mail-parser = "0.9"
# Already in the tree via rustls; used directly for SHA-256 instead of another crate.
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
# ring instead of aws-lc-rs: no cmake/nasm needed for Windows and Android cross builds.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
