<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Carteiro</title>
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="topbar desktop-only" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region><img src="logo.svg" alt="" width="28" height="28" />Carteiro</div>
        <div class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5"/></svg>
          <input placeholder="Search" data-input="search" aria-label="Search mail" />
        </div>
        <div class="top-actions">
          <button class="icon-btn" title="Sync" data-click="sync"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M20 11a8 8 0 0 0-14.9-3M4 4v4h4M4 13a8 8 0 0 0 14.9 3M20 20v-4h-4"/></svg></button>
          <button class="icon-btn" title="Switch theme" data-click="theme"><span class="theme-icon"></span></button>
          <div class="acct-wrap">
            <button class="icon-btn" title="Accounts" data-click="acct-menu" aria-haspopup="menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"/></svg></button>
          </div>
          <button class="icon-btn" title="Settings" data-click="settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg></button>
        </div>
        <div class="win-controls" hidden>
          <button class="win-btn" title="Minimize" data-click="win-min"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.2"/></svg></button>
          <button class="win-btn" title="Maximize" data-click="win-max"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
          <button class="win-btn close" title="Close" data-click="win-close"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.2"/></svg></button>
        </div>
      </header>
      <div class="body">
        <nav class="rail" aria-label="Apps">
          <button class="rail-btn on" data-click="mode" data-mode="mail" title="Mail"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v12H3zM3 7l9 6 9-6"/></svg><span>Mail</span></button>
          <button class="rail-btn" data-click="mode" data-mode="calendar" title="Calendar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v15H4zM4 9h16M8 3v4M16 3v4"/></svg><span>Calendar</span></button>
        </nav>
        <div class="scrim" data-click="scrim"></div>
        <aside class="folders" id="folders"></aside>
        <section class="list">
          <header class="mobile-head mobile-only">
            <button class="icon-btn" aria-label="Menu" data-click="menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
            <div class="mobile-title" id="mobile-title"></div>
            <button class="icon-btn" aria-label="Filter" data-click="filter-menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 7.5V19l-4 1.5v-8z"/></svg></button>
            <button class="icon-btn" aria-label="Rules" data-click="rules"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M4 12h16M4 18h7M17 4v4M14 16v4"/></svg></button>
            <button class="icon-btn" aria-label="Sync" data-click="sync"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M20 11a8 8 0 0 0-14.9-3M4 4v4h4M4 13a8 8 0 0 0 14.9 3M20 20v-4h-4"/></svg></button>
          </header>
          <div class="mobile-search mobile-only"><input placeholder="Search" data-input="search" aria-label="Search mail" /></div>
          <div class="list-head desktop-only"><span id="list-title"></span>
            <button class="icon-btn" title="Filter: unread, flagged, to me, with attachments" data-click="filter-menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 7.5V19l-4 1.5v-8z"/></svg></button>
            <button class="icon-btn" title="Rules: sort incoming mail automatically" data-click="rules"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M4 12h16M4 18h7M17 4v4M14 16v4"/></svg><span class="btn-label">Rules</span></button></div>
          <div class="filter-bar" id="filter-bar" hidden></div>
          <div class="filter-menu" id="filter-menu" role="menu" hidden></div>
          <div class="threads" id="threads" role="listbox" aria-label="Conversations"></div>
        </section>
        <section class="reader" id="reader"></section>
        <section class="calendar" id="calendar" hidden></section>
      </div>
      <button class="fab mobile-only" aria-label="New mail" data-click="compose"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg></button>
      <div class="toast" id="toast" role="status" hidden></div>
    </div>
    <div class="acct-menu" id="acct-menu" role="menu" hidden></div>
    <div id="compose"></div>
    <div id="modal"></div>
  </body>
</html>
