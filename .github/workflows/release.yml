name: Package

# Builds the Windows MSI, the Linux AppImage and the Android APK, has
# VirusTotal scan them, and only then (on v* tags) publishes the release with
# a signed update manifest. Can also run manually from the Actions tab
# (build + scan, no release).
#
# Secrets:
#   VIRUSTOTAL_API_KEY   required: nothing is released unscanned
#   UPDATE_SIGNING_KEY   Ed25519 private key (PEM) that signs latest.json;
#                        without it, builds have no auto-update channel
#   ANDROID_KEYSTORE_BASE64 / _PASSWORD / ANDROID_KEY_ALIAS   APK signing
#   CARTEIRO_GOOGLE_CLIENT_ID / _SECRET, CARTEIRO_MICROSOFT_CLIENT_ID
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARTEIRO_UPDATE_REPO: ${{ github.repository }}
  CARTEIRO_GOOGLE_CLIENT_ID: ${{ secrets.CARTEIRO_GOOGLE_CLIENT_ID }}
  CARTEIRO_GOOGLE_CLIENT_SECRET: ${{ secrets.CARTEIRO_GOOGLE_CLIENT_SECRET }}
  CARTEIRO_MICROSOFT_CLIENT_ID: ${{ secrets.CARTEIRO_MICROSOFT_CLIENT_ID }}

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The app compares this version with the release's; they must agree.
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the workspace version $version (Cargo.toml)"; exit 1
          fi

  windows:
    name: Windows MSI
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Update channel public key
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: .github/scripts/update-pubkey.sh >> "$GITHUB_ENV"
      - run: cargo install tauri-cli --version "=2.12.4" --locked
      - run: cargo tauri icon app-icon.svg
      - name: Bundle ClamAV (pinned, checksum-verified)
        shell: bash
        run: scripts/fetch-clamav.sh windows-x64
      - run: cargo tauri build --bundles msi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carteiro-windows-msi
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error

  linux:
    name: Linux AppImage
    needs: version
    # The oldest supported runner: AppImages run on systems at least as new
    # as the one they were built on.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Update channel public key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: .github/scripts/update-pubkey.sh >> "$GITHUB_ENV"
      - run: cargo install tauri-cli --version "=2.12.4" --locked
      - run: cargo tauri icon app-icon.svg
      - name: Bundle ClamAV (pinned, checksum-verified)
        run: scripts/fetch-clamav.sh linux-x64
      - name: Cache AppImage tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/carteiro-appimage-tools
          key: appimage-tools-${{ hashFiles('scripts/fetch-appimage-tools.sh') }}
      - name: AppImage tools (pinned, checksum-verified)
        run: scripts/fetch-appimage-tools.sh
      - run: cargo tauri build --bundles appimage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carteiro-linux-appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Update channel public key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: .github/scripts/update-pubkey.sh >> "$GITHUB_ENV"
      - run: cargo install tauri-cli --version "=2.12.4" --locked
      - run: cargo tauri icon app-icon.svg
      - run: cargo tauri android init --ci
      - name: Cache ClamAV for Android
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/clamav-android/out
          key: clamav-android-${{ hashFiles('scripts/build-clamav-android.sh') }}
      - name: Build ClamAV for Android (pinned, checksum-verified sources)
        run: |
          set -euo pipefail
          OUT=target/clamav-android/out
          for abi in arm64-v8a x86_64; do
            [ -f "$OUT/$abi/libclamd.so" ] || JNILIBS_DIR="$PWD/$OUT" scripts/build-clamav-android.sh "$abi"
          done
      - name: Finish the Android project (ClamAV, extracted native libraries, pinned Gradle)
        run: scripts/prepare-android.sh
      # Gradle's downloads (Kotlin compiler, Android plugin, libraries), reused
      # between runs; keyed by the generated build files.
      - name: Cache Gradle downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('src-tauri/gen/android/**/*.gradle.kts', 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: "Build the APK (retried once: dependency downloads can stall)"
        run: cargo tauri android build --apk --target aarch64 --target x86_64 || { sleep 30; cargo tauri android build --apk --target aarch64 --target x86_64; }
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Android only installs updates signed with the same key, so a
            # throwaway key would strand every user of this release.
            echo "::error::Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS before releasing"; exit 1
          else
            # Manual test build: a throwaway key so the APK installs.
            KEYSTORE_PASSWORD=android KEY_ALIAS=test
            keytool -genkeypair -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Carteiro Test"
          fi
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find src-tauri/gen/android -name '*-unsigned.apk' | head -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" \
            --out "Carteiro_${VERSION}_android.apk" aligned.apk
          rm -f release.keystore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carteiro-android-apk
          path: Carteiro_*_android.apk
          if-no-files-found: error

  # ----------------------------------------------------------- VirusTotal gate
  virustotal:
    name: VirusTotal scan
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Scan packages (block on any detection)
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          VT_SUMMARY: ${{ github.step_summary }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f \( -name '*.msi' -o -name '*.AppImage' -o -name '*.apk' \) | sort)
          [ "${#files[@]}" -eq 3 ] || { echo "::error::expected 3 packages, found ${#files[@]}: ${files[*]}"; exit 1; }
          printf '### VirusTotal\n\n| Package | Malicious | Suspicious | Report |\n|---|---|---|---|\n' >> "$VT_SUMMARY"
          .github/scripts/virustotal-scan.sh "${files[@]}"

  # ------------------------------------------------------------------ release
  release:
    name: Publish GitHub release
    needs: [version, virustotal]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Checksums and signed update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir dist
          find artifacts -type f \( -name '*.msi' -o -name '*.AppImage' -o -name '*.apk' \) -exec cp {} dist/ \;
          cd dist
          sha256sum -- * > SHA256SUMS
          entry() { # entry <kind> <glob>
            local f; f=$(ls $2 | head -1)
            jq -n --arg k "$1" --arg n "$f" --arg s "$(sha256sum "$f" | cut -d' ' -f1)" '{($k): {name: $n, sha256: $s}}'
          }
          jq -cs --arg v "$VERSION" '{version: $v, files: add}' \
            <(entry windows-msi '*.msi') <(entry linux-appimage '*.AppImage') <(entry android-apk '*.apk') > latest.json
          cat latest.json
          # Installed copies only accept updates with this signature.
          [ -n "${UPDATE_SIGNING_KEY:-}" ] || { echo "::error::Set the UPDATE_SIGNING_KEY secret (see README) before releasing"; exit 1; }
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_KEY" > ../update-key.pem
          openssl pkeyutl -sign -rawin -inkey ../update-key.pem -in latest.json | base64 -w0 > latest.json.sig
          rm -f ../update-key.pem
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.msi
            dist/*.AppImage
            dist/*.apk
            dist/SHA256SUMS
            dist/latest.json
            dist/latest.json.sig
