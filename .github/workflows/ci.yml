name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  supply-chain:
    name: Dependency audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Built from crates.io (checksum-verified, exact version, locked
      # dependencies) instead of cargo-deny-action, whose Docker image
      # downloads a binary with curl and no checksum.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-deny --version "=0.20.2" --locked
      - run: cargo deny --locked check advisories bans sources

  core:
    name: mail-core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p mail-core --locked
      - run: cargo clippy -p mail-core --all-targets --locked
      - name: Component license list is up to date (Settings > About)
        if: runner.os == 'Linux'
        run: python3 -I scripts/gen-licenses.py && git diff --exit-code ui/licenses.json

  windows-msi:
    name: Windows MSI builds
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install tauri-cli --version "=2.12.4" --locked
      - run: cargo tauri icon app-icon.svg
      - name: Bundle ClamAV (pinned, checksum-verified)
        shell: bash
        run: scripts/fetch-clamav.sh windows-x64
      # WiX 3.14.1 is fetched by the pinned tauri-cli and checked by SHA-256.
      - run: cargo tauri build --bundles msi
      # Unpack the MSI without installing it, then check the app and the
      # bundled ClamAV are there and that clamd starts (a missing DLL makes
      # Windows refuse to start it).
      - name: Check the MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = (Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP "msi-unpacked"
          $p = Start-Process msiexec.exe -ArgumentList "/a", "`"$msi`"", "/qn", "TARGETDIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /a failed with $($p.ExitCode)" }
          $app = Get-ChildItem $dir -Recurse -Filter carteiro.exe | Select-Object -First 1
          $clamd = Get-ChildItem $dir -Recurse -Filter clamd.exe | Select-Object -First 1
          $fresh = Get-ChildItem $dir -Recurse -Filter freshclam.exe | Select-Object -First 1
          if (-not $app -or -not $clamd -or -not $fresh) { throw "missing from the MSI: carteiro.exe, clamd.exe or freshclam.exe" }
          $out = & $clamd.FullName --version 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch "ClamAV|clamd.conf|config") { throw "the bundled clamd didn't start (exit $LASTEXITCODE)" }
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carteiro-windows-msi-ci-test
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android APK builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install tauri-cli --version "=2.12.4" --locked
      - run: cargo tauri icon app-icon.svg
      - run: cargo tauri android init --ci
      # The ClamAV build (~20 min) only reruns when its script changes.
      - name: Cache ClamAV for Android
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/clamav-android/out
          key: clamav-android-${{ hashFiles('scripts/build-clamav-android.sh') }}
      - name: Build ClamAV for Android (pinned, checksum-verified sources)
        run: |
          set -euo pipefail
          OUT=target/clamav-android/out
          for abi in arm64-v8a x86_64; do
            [ -f "$OUT/$abi/libclamd.so" ] || JNILIBS_DIR="$PWD/$OUT" scripts/build-clamav-android.sh "$abi"
          done
      - name: Finish the Android project (ClamAV, icon, activity, pinned Gradle)
        run: scripts/prepare-android.sh
      # Gradle's downloads (Kotlin compiler, Android plugin, libraries), reused
      # between runs; keyed by the generated build files.
      - name: Cache Gradle downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('src-tauri/gen/android/**/*.gradle.kts', 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: "Build the APK (retried once: dependency downloads can stall)"
        run: cargo tauri android build --apk --target aarch64 --target x86_64 || { sleep 30; cargo tauri android build --apk --target aarch64 --target x86_64; }
      - name: Sign with a throwaway test key
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore test.keystore -storepass android -alias test \
            -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Carteiro CI test build"
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find src-tauri/gen/android -name '*-unsigned.apk' | head -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks test.keystore --ks-pass pass:android --ks-key-alias test --out Carteiro-ci-test.apk aligned.apk
          rm -f test.keystore
      # A test build: not for distribution (its signing key is thrown away,
      # so it can't be updated by release builds).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carteiro-android-ci-test
          path: Carteiro-ci-test.apk
          if-no-files-found: error
          retention-days: 7

  linux-appimage:
    name: Linux AppImage builds
    # As in releases: AppImages run on systems at least as new as the builder.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install tauri-cli --version "=2.12.4" --locked
      - run: cargo tauri icon app-icon.svg
      - name: Bundle ClamAV (pinned, checksum-verified)
        run: scripts/fetch-clamav.sh linux-x64
      - name: AppImage tools (pinned, checksum-verified)
        run: scripts/fetch-appimage-tools.sh
      - run: cargo tauri build --bundles appimage
      # An AppImage can build and still not start: check that every bundled
      # program finds its libraries and that the bundled ClamAV runs.
      - name: Check the AppImage
        run: |
          set -euo pipefail
          APP=$(ls target/release/bundle/appimage/*.AppImage)
          cd "$(mktemp -d)" && "$OLDPWD/$APP" --appimage-extract >/dev/null
          C=$(find squashfs-root -type d -name clamav | head -1)
          for bin in squashfs-root/usr/bin/carteiro "$C/clamd" "$C/freshclam"; do
            if LD_LIBRARY_PATH= ldd "$bin" | grep 'not found'; then echo "::error::$bin is missing libraries"; exit 1; fi
          done
          # Without a config file clamd stops at reading it (and exits non-zero),
          # which proves it started with its bundled libraries.
          out=$(env -u LD_LIBRARY_PATH "$C/clamd" --version 2>&1 || true)
          echo "$out"
          grep -qE "ClamAV|clamd.conf" <<<"$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carteiro-linux-appimage-ci-test
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
