<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The AppImage's WebKit aborts drawing COLRv1 color fonts (Fedora's
     Noto-COLRv1 emoji): the system's font setup without those files, plus
     the bitmap Noto Color Emoji the AppImage brings (its folder is filled
     in at start). -->
<fontconfig>
  <dir>@EMOJI_DIR@</dir>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont><rejectfont><glob>*COLRv1*</glob></rejectfont></selectfont>
</fontconfig>
